<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Content Moderation in AI · DigiLabour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,500;1,9..144,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --cream:   #f5f1ea;
  --cream2:  #ede8df;
  --cream3:  #e4ddd2;
  --ink:     #18140f;
  --ink2:    #2c2820;
  --ink3:    #46403a;
  --muted:   #78726a;
  --faint:   #a89e96;
  --rule:    #d4ccc0;
  --rule2:   #c4bbb0;

  --terra:   #c03d0a;
  --terra2:  #9c3108;
  --terra-l: #fceee6;
  --terra-m: rgba(192,61,10,.1);

  --sage:    #2f5e3f;
  --sage-l:  #e5f0e9;
  --slate:   #244060;
  --slate-l: #e4ecf5;
  --gold:    #8c5e08;
  --gold-l:  #faf0cc;
  --violet:  #522e8c;
  --violet-l:#f0ebff;
  --teal:    #155a52;
  --teal-l:  #e2f3f1;
  --danger:  #aa1818;
  --danger-l:#fef0f0;

  --fh:'Fraunces',Georgia,serif;
  --fb:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',monospace;

  --r:6px; --rlg:10px; --rxl:16px; --r2x:22px;
  --s1:0 1px 4px rgba(24,20,15,.05),0 1px 8px rgba(24,20,15,.03);
  --s2:0 4px 18px rgba(24,20,15,.08),0 1px 4px rgba(24,20,15,.04);
  --s3:0 12px 44px rgba(24,20,15,.12),0 2px 8px rgba(24,20,15,.06);
  --sc:0 1px 3px rgba(24,20,15,.04),0 2px 8px rgba(24,20,15,.03);
  --sh:0 8px 28px rgba(24,20,15,.1),0 2px 8px rgba(24,20,15,.06);

  --nav-w:260px;
  --mob-nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--cream);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--cream3);border-radius:10px}

/* ══ SHELL ══ */
#shell{display:flex;height:100vh;overflow:hidden}

/* ══ SIDEBAR ══ */
#sidebar{
  width:var(--nav-w);flex-shrink:0;
  background:var(--ink);
  display:flex;flex-direction:column;
  overflow:hidden;z-index:100;position:relative;
}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.sb-logo-mark{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.sb-wordmark{font-family:var(--fh);font-size:13px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:-.1px}
.sb-wordmark em{font-style:italic;color:rgba(255,255,255,.45);font-weight:300}
.sb-edition{font-family:var(--fm);font-size:9px;color:rgba(255,255,255,.25);letter-spacing:1.4px;text-transform:uppercase}

.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:1.2px;padding:12px 10px 4px}
.nb{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:rgba(255,255,255,.42);font-size:13px;font-weight:400;margin-bottom:1px;border:none;background:transparent;width:100%;text-align:left;font-family:var(--fb);transition:all .13s;position:relative}
.nb:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.72)}
.nb.on{background:var(--terra);color:#fff;font-weight:500}
.nb svg{width:15px;height:15px;flex-shrink:0;opacity:.45;transition:opacity .13s;color:currentColor}
.nb.on svg{opacity:1}
.nbadge{margin-left:auto;font-size:10px;font-family:var(--fm);background:rgba(255,255,255,.09);color:rgba(255,255,255,.38);padding:1px 6px;border-radius:12px}
.nb.on .nbadge{background:rgba(255,255,255,.18);color:#fff}

.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.fb{flex:1;padding:5px 4px;border-radius:var(--r);font-size:10px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.3);font-family:var(--fb);transition:all .13s;text-align:center;letter-spacing:.3px;text-transform:uppercase}
.fb:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55)}
.fb.red:hover{background:rgba(170,24,24,.3);color:#fca5a5;border-color:rgba(170,24,24,.4)}

/* ══ MAIN ══ */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--cream)}
#topbar{height:54px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 24px;gap:12px;box-shadow:var(--s1);z-index:50}
.tb-title{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.saved-flag{font-size:11px;color:var(--sage);display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .2s}
.saved-flag::before{content:'✓';font-weight:700}
.saved-flag.on{opacity:1}
.btn{padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--rule2);background:#fff;color:var(--ink2);font-family:var(--fb);transition:all .13s;white-space:nowrap}
.btn:hover{background:var(--cream);border-color:var(--rule2)}
.btn.acc{background:var(--terra);color:#fff;border-color:var(--terra);box-shadow:0 2px 8px rgba(192,61,10,.28)}
.btn.acc:hover{background:var(--terra2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(192,61,10,.33)}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--muted)}
.btn.ghost:hover{background:var(--cream);color:var(--ink2)}
.btn.danger{background:var(--danger-l);color:var(--danger);border-color:rgba(170,24,24,.2)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11px}

.page{display:none;flex:1;overflow:hidden}
.page.on{display:flex}

/* ══ SYNC BAR ══ */
#syncbar{position:fixed;bottom:0;left:0;right:0;height:26px;background:var(--ink2);color:rgba(255,255,255,.55);display:none;align-items:center;padding:0 14px;font-size:11px;font-family:var(--fm);z-index:400;gap:8px;letter-spacing:.15px}
#syncbar.on{display:flex}
.sdot{width:6px;height:6px;border-radius:50%;background:#2f5e3f;flex-shrink:0}
.sdot.pulse{animation:sp 2s infinite}
.sdot.saving{background:var(--gold)}
.sdot.err{background:var(--danger)}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.25}}
.sright{margin-left:auto;display:flex;gap:8px;align-items:center}
.sbtn{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);border-radius:3px;font-size:10px;cursor:pointer;padding:1px 7px;font-family:var(--fm);transition:all .13s}
.sbtn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:30px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.ti{background:#fff;border:1px solid var(--rule);color:var(--ink);padding:10px 16px;border-radius:var(--rlg);font-size:13px;box-shadow:var(--s3);animation:tia .16s ease;pointer-events:none;max-width:300px}
.ti.s{border-left:3px solid var(--sage);color:var(--sage)}
.ti.e{border-left:3px solid var(--danger);color:var(--danger)}
.ti.w{border-left:3px solid var(--gold);color:var(--gold)}
@keyframes tia{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* ══ CONFIRM ══ */
#cov{position:fixed;inset:0;background:rgba(24,20,15,.5);backdrop-filter:blur(3px);z-index:9900;display:none;align-items:center;justify-content:center}
#cov.on{display:flex}
.cbox{background:#fff;border-radius:var(--r2x);padding:28px 30px;max-width:400px;width:92%;box-shadow:var(--s3)}
.cbox h3{font-family:var(--fh);font-size:17px;font-weight:700;margin-bottom:6px}
.cbox p{font-size:13px;color:var(--ink3);margin-bottom:20px;line-height:1.6}
.cbox-btns{display:flex;gap:8px;justify-content:flex-end}

/* ══ COMPONENTS ══ */
.card{background:#fff;border:1px solid var(--rule);border-radius:var(--rlg);padding:18px 20px;box-shadow:var(--sc);transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:var(--sh);border-color:var(--rule2)}
.ch{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.fg{margin-bottom:11px}
.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px}
input.fi,textarea.fta,select.fsel{width:100%;padding:9px 11px;border:1px solid var(--rule2);border-radius:var(--r);font-size:13px;font-family:var(--fb);background:#fff;color:var(--ink);transition:border-color .13s;outline:none}
input.fi:focus,textarea.fta:focus,select.fsel:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(192,61,10,.09)}
input.fi::placeholder,textarea.fta::placeholder{color:var(--faint)}
textarea.fta{resize:vertical;line-height:1.55}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid transparent;transition:all .13s;user-select:none}
.chip.on{border-color:currentColor;font-weight:600}
.tbdg{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.t-academic{background:#dbeafe;color:#1e40af}
.t-ngo{background:var(--sage-l);color:var(--sage)}
.t-journalist{background:var(--terra-l);color:var(--terra)}
.t-platform{background:var(--violet-l);color:var(--violet)}
.t-legal{background:var(--teal-l);color:var(--teal)}
.t-other{background:var(--cream2);color:var(--muted)}
.stchip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:600;font-family:var(--fm);text-transform:uppercase;letter-spacing:.3px}
.st-pending{background:var(--cream2);color:var(--muted)}
.st-scheduled{background:var(--gold-l);color:var(--gold)}
.st-done{background:var(--sage-l);color:var(--sage)}
.st-published{background:var(--slate-l);color:var(--slate)}
.empty{text-align:center;color:var(--faint);padding:40px 20px;font-size:13px;line-height:1.7}
.divl{height:1px;background:var(--rule);margin:10px 0}

/* ══ MODAL ══ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(24,20,15,.45);backdrop-filter:blur(4px);z-index:9800;overflow-y:auto;padding:32px 16px;align-items:flex-start;justify-content:center}
.modal-bg.on{display:flex}
.modal-box{background:#fff;border-radius:var(--r2x);padding:28px 30px;max-width:720px;width:100%;box-shadow:var(--s3);position:relative;margin:auto}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;transition:color .13s}
.modal-close:hover{color:var(--ink)}
.modal-title{font-family:var(--fh);font-size:19px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:-.2px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:22px}

/* ══ EPISODES PAGE (main view) ══ */
#page-eps{flex-direction:row}
.ep-list-col{width:320px;flex-shrink:0;border-right:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;overflow:hidden}
.ep-list-head{padding:14px 16px;border-bottom:1px solid var(--rule);flex-shrink:0;display:flex;align-items:center;gap:8px}
.ep-list-head h2{font-family:var(--fh);font-size:14px;font-weight:700;color:var(--ink);flex:1}
.ep-list{flex:1;overflow-y:auto}
.ep-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid rgba(24,20,15,.05);transition:background .12s;position:relative;display:flex;gap:10px;align-items:flex-start}
.ep-item:hover{background:var(--cream)}
.ep-item.on{background:var(--terra-l);border-left:3px solid var(--terra)}
.ep-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.ep-item-title{font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;margin-bottom:3px}
.ep-item-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* episode detail — the hub */
.ep-detail{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ep-detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;flex-direction:column;gap:10px}

/* ep detail header */
.ep-dh{padding:16px 22px;background:#fff;border-bottom:1px solid var(--rule);flex-shrink:0;box-shadow:var(--s1)}
.ep-dh-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.ep-dh-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;color:#fff}
.ep-dh-title{font-family:var(--fh);font-size:18px;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.2px;flex:1}
.ep-dh-angle{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
.ep-dh-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ep detail tabs */
.ep-tabs{display:flex;border-bottom:1px solid var(--rule);background:#fff;flex-shrink:0;padding:0 20px;overflow-x:auto}
.ep-tab{padding:10px 16px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;background:none;font-family:var(--fb);transition:all .13s;white-space:nowrap;flex-shrink:0}
.ep-tab:hover{color:var(--ink2)}
.ep-tab.on{color:var(--terra);border-bottom-color:var(--terra);font-weight:600}

/* ep detail tab content */
.ep-tc{flex:1;overflow-y:auto;padding:20px 22px;background:var(--cream)}

/* ── TAB: Ficha ── */
.pessoa-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:1px solid var(--rule);border-radius:var(--rlg);margin-bottom:6px;transition:all .15s}
.pessoa-chip:hover{border-color:var(--terra);box-shadow:var(--s1)}
.pav{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--fh)}
.pessoa-chip-name{flex:1;font-size:13px;font-weight:500;color:var(--ink)}
.pessoa-chip-sub{font-size:11px;color:var(--muted)}

/* ── TAB: Roteiro ── */
.q-item{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:#fff;border:1px solid var(--rule);border-radius:var(--r);margin-bottom:7px;transition:border-color .13s}
.q-item:hover{border-color:var(--rule2)}
.q-n{font-size:10px;font-weight:700;color:var(--terra);min-width:20px;margin-top:2px;font-family:var(--fm)}
.q-txt{flex:1;font-size:13px;line-height:1.55;outline:none;background:transparent;color:var(--ink);resize:none;border:none;font-family:var(--fb);min-height:20px}
.q-del{color:var(--faint);cursor:pointer;font-size:15px;background:none;border:none;transition:color .13s;padding:0 2px;flex-shrink:0}
.q-del:hover{color:var(--danger)}
.add-row{display:flex;gap:7px;margin-top:8px}
.add-inp{flex:1;padding:9px 11px;border:1px solid var(--rule2);border-radius:var(--r);font-size:13px;font-family:var(--fb);background:#fff;color:var(--ink);transition:border-color .13s;outline:none}
.add-inp:focus{border-color:var(--terra)}
.add-inp::placeholder{color:var(--faint)}

/* ── TAB: Trechos ── */
.ex-item{background:#fff;border:1px solid var(--rule);border-left:3px solid var(--terra);border-radius:0 var(--r) var(--r) 0;padding:11px 13px;margin-bottom:9px;transition:box-shadow .13s}
.ex-item:hover{box-shadow:var(--s1)}
.ex-meta{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ex-txt{font-size:13px;line-height:1.7;font-style:italic;color:var(--ink2)}

/* ── TAB: Publicação ── */
.pub-toolbar{display:flex;gap:4px;padding:8px 12px;background:var(--cream2);border-bottom:1px solid var(--rule);flex-wrap:wrap;align-items:center;flex-shrink:0}
.tool-btn{padding:4px 10px;border:1px solid var(--rule2);border-radius:var(--r);font-size:12px;cursor:pointer;background:#fff;color:var(--ink2);transition:all .11s;font-family:var(--fb)}
.tool-btn:hover{background:var(--terra);color:#fff;border-color:var(--terra)}
.pub-ed{width:100%;flex:1;padding:20px;font-size:14px;line-height:1.82;font-family:var(--fb);border:none;resize:none;background:#fff;color:var(--ink);outline:none}

/* ══ PEOPLE PAGE ══ */
#page-ppl{flex-direction:column;overflow-y:auto;background:var(--cream)}
.ppl-bar{padding:14px 22px;border-bottom:1px solid var(--rule);background:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:var(--s1);flex-wrap:wrap}
.ppl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;padding:18px 22px}
.pc{background:#fff;border:1px solid var(--rule);border-radius:var(--rxl);padding:15px;box-shadow:var(--sc);position:relative;overflow:hidden;transition:all .18s;cursor:default}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--terra);opacity:0;transition:opacity .18s}
.pc:hover{box-shadow:var(--sh);border-color:var(--rule2);transform:translateY(-1px)}
.pc:hover::before{opacity:1}
.pc-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.pc-photo{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--fh);color:#fff;overflow:hidden}
.pc-name{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:2px}
.pc-org{font-size:11px;color:var(--muted);line-height:1.4}
.pc-loc{font-size:10px;color:var(--faint);margin-top:2px}
.pc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:9px;border-top:1px solid rgba(24,20,15,.05);margin-top:9px}
.pc-acts{display:flex;gap:4px}
.pca{padding:3px 8px;border-radius:var(--r);font-size:11px;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--muted);transition:all .13s;font-family:var(--fb)}
.pca:hover{background:var(--cream);color:var(--ink2);border-color:var(--rule2)}
.pca.red:hover{background:var(--danger-l);color:var(--danger);border-color:rgba(170,24,24,.2)}
.filt-btn{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--rule2);background:transparent;color:var(--muted);transition:all .13s;font-family:var(--fb)}
.filt-btn:hover{background:var(--cream)}
.filt-btn.on{background:var(--terra);color:#fff;border-color:var(--terra)}

/* ══ DASHBOARD ══ */
#page-dash{flex-direction:column;overflow-y:auto;background:var(--cream)}
.dash-inner{padding:28px 28px;max-width:1080px}
.dash-eyebrow{font-family:var(--fm);font-size:10px;font-weight:500;color:var(--terra);text-transform:uppercase;letter-spacing:2px;margin-bottom:9px;display:flex;align-items:center;gap:10px}
.dash-eyebrow::before{content:'';width:20px;height:1px;background:var(--terra)}
.dash-h1{font-family:var(--fh);font-size:34px;font-weight:900;color:var(--ink);letter-spacing:-.8px;line-height:1.1;margin-bottom:5px}
.dash-h1 em{font-style:italic;color:var(--terra)}
.dash-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:24px}
.mc{background:#fff;border:1px solid var(--rule);border-radius:var(--rlg);padding:15px 13px;box-shadow:var(--sc);position:relative;overflow:hidden;transition:all .18s;cursor:default}
.mc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.mc:nth-child(1)::after{background:var(--terra)}
.mc:nth-child(2)::after{background:var(--sage)}
.mc:nth-child(3)::after{background:var(--slate)}
.mc:nth-child(4)::after{background:var(--gold)}
.mc:nth-child(5)::after{background:var(--teal)}
.mc:nth-child(6)::after{background:var(--violet)}
.mc:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.mc-icon{font-size:17px;margin-bottom:7px;display:block}
.mc-val{font-family:var(--fh);font-size:26px;font-weight:900;line-height:1;margin-bottom:4px}
.mc-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:18px}

/* ══ MOBILE ══ */
#mob-ham{display:none;position:fixed;top:10px;left:12px;z-index:210;width:38px;height:38px;border-radius:var(--r);background:var(--ink);border:none;cursor:pointer;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#mob-ham svg{width:17px;height:17px;color:rgba(255,255,255,.7)}
#mob-overlay{display:none;position:fixed;inset:0;background:rgba(24,20,15,.6);z-index:149;backdrop-filter:blur(2px);opacity:0;transition:opacity .22s}
#mob-overlay.on{opacity:1}
#mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--mob-nav-h);background:var(--ink);border-top:1px solid rgba(255,255,255,.07);z-index:200;align-items:stretch}
.mni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:none;border:none;color:rgba(255,255,255,.38);font-family:var(--fb);font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;-webkit-tap-highlight-color:transparent;transition:color .13s}
.mni svg{width:19px;height:19px;opacity:.45;transition:opacity .13s}
.mni.on{color:var(--terra)}
.mni.on svg{opacity:1}
#mob-more-sheet{display:none;position:fixed;bottom:var(--mob-nav-h);left:0;right:0;background:var(--ink);border-top:1px solid rgba(255,255,255,.07);z-index:201;transform:translateY(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);padding:6px 0 4px}
#mob-more-sheet.on{transform:translateY(0)}
.mmi{display:flex;align-items:center;gap:13px;padding:13px 18px;color:rgba(255,255,255,.5);font-size:14px;font-weight:500;cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:var(--fb);-webkit-tap-highlight-color:transparent;transition:color .13s}
.mmi svg{width:17px;height:17px;opacity:.5;flex-shrink:0}
.mmi.on{color:var(--terra)}

@media (max-width:768px){
  html,body{overflow:auto;height:auto;min-height:100%}
  #shell{flex-direction:column;height:auto;min-height:100dvh;overflow:visible}
  #sidebar{position:fixed;top:0;left:0;bottom:0;height:100dvh;width:min(280px,88vw);transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:150}
  #sidebar.on{transform:translateX(0)}
  #main{width:100%;min-height:100dvh;padding-bottom:var(--mob-nav-h);display:block;overflow:visible}
  #topbar{height:50px;padding:0 52px 0 14px;position:sticky;top:0;z-index:100}
  .tb-title{font-size:14px}
  .page{display:none;width:100%;min-height:calc(100dvh - 50px - var(--mob-nav-h));overflow:visible;flex-direction:column}
  .page.on{display:flex}
  #mob-ham{display:flex}
  #mob-nav{display:flex}
  #syncbar{bottom:var(--mob-nav-h);height:24px;font-size:10px}

  /* episodes mobile */
  #page-eps{flex-direction:column}
  .ep-list-col{width:100%;border-right:none;border-bottom:1px solid var(--rule);max-height:45vh;flex-shrink:0}
  .ep-detail{min-height:55vh}

  /* people mobile */
  .ppl-grid{grid-template-columns:1fr;padding:14px 14px}
  .ppl-bar{padding:10px 14px}
  .ppl-bar .fi{max-width:100%}

  /* dashboard mobile */
  .dash-inner{padding:16px 14px}
  .dash-h1{font-size:24px}
  .metrics{grid-template-columns:repeat(3,1fr);gap:9px}
  .mc{padding:11px 10px}
  .mc-val{font-size:22px}
  .mc-sub{display:none}
  .dash-grid{grid-template-columns:1fr;gap:14px}

  /* grids */
  .g2,.g3{grid-template-columns:1fr;gap:10px}

  /* touch */
  .btn{min-height:38px}
  input.fi,textarea.fta,select.fsel{font-size:16px;padding:10px 11px}

  /* modals */
  .modal-bg{padding:0;align-items:flex-end}
  .modal-box{border-radius:var(--r2x) var(--r2x) 0 0;padding:24px 18px 32px;max-width:100%;max-height:92dvh;overflow-y:auto;margin:0}
}
@media (max-width:380px){
  .metrics{grid-template-columns:repeat(2,1fr)}
}
</style>

const S = {
  data: null, dirty: false, _t: null,
  load(){ try{ const s=localStorage.getItem(SK); this.data=s?this._v(JSON.parse(s)):this._c(); }catch{ this.data=this._c(); } },
  _c(){ return JSON.parse(JSON.stringify(DEFAULT)); },
  _v(d){
    if(!d||typeof d!=='object') throw 0;
    if(!Array.isArray(d.people)) d.people=[];
    if(!Array.isArray(d.episodes)) d.episodes=[];
    d.episodes.forEach((e,i)=>{ if(typeof e.order!=='number') e.order=i+1; if(!e.published) e.published={title:'',subtitle:'',intro:'',body:'',keywords:''}; if(!Array.isArray(e.questions)) e.questions=[]; if(!Array.isArray(e.excerpts)) e.excerpts=[]; });
    return d;
  },
  save(now=false){ this.dirty=true; clearTimeout(this._t); if(now) this._p(); else this._t=setTimeout(()=>this._p(),600); },
  _p(){
    try{
      const j=JSON.stringify(this.data);
      localStorage.setItem(SK,j);
      this.dirty=false;
      const f=document.getElementById('sf');
      if(f){f.classList.add('on');setTimeout(()=>f.classList.remove('on'),1800);}
    }catch(e){ toast('Erro localStorage: '+e.message,'e'); }
    sbWrite();
  },
  get p(){ return this.data.people; },
  get e(){ return this.data.episodes.slice().sort((a,b)=>a.order-b.order); },
  P(id){ return this.p.find(x=>x.id===id); },
  E(id){ return this.data.episodes.find(x=>x.id===id); },
  uE(id,f,v){ const e=this.E(id); if(e){e[f]=v;this.save();} },
  uP(id,f,v){ const p=this.P(id); if(p){p[f]=v;this.save();} },
  dE(id){ this.data.episodes=this.data.episodes.filter(e=>e.id!==id); this.data.episodes.sort((a,b)=>a.order-b.order).forEach((e,i)=>e.order=i+1); this.save(true); },
  dP(id){ this.data.people=this.p.filter(x=>x.id!==id); this.data.episodes.forEach(e=>{ e.researchers=(e.researchers||[]).filter(r=>r!==id); }); this.save(true); },
  uid(){ return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2); }
};

// HELPERS
// ══════════════════════════════════════════════════
function san(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,''); }
function ini(n){ return String(n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function clr(id){ return COLORS[String(id).charCodeAt(0)%COLORS.length]; }
function ecolor(ep){ return EC[(ep.order-1)%EC.length]; }
function stchip(st){ return `<span class="stchip st-${st}">${EL[st]||st}</span>`; }
function tbdg(t){ return `<span class="tbdg t-${t}">${TL[t]||t}</span>`; }
function pav(p,sz=32){
  const bg=clr(p.id);
  if(p.photo) return `<div class="pav" style="width:${sz}px;height:${sz}px;background:${bg};overflow:hidden"><img src="${san(p.photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.style.display='none'"></div>`;
  return `<div class="pav" style="width:${sz}px;height:${sz}px;background:${bg};font-size:${Math.round(sz*.28)}px">${san(ini(p.name))}</div>`;
}

// Episode actions
function toggleTag(id,tag){ const e=S.E(id); if(!e)return; e.tags=e.tags||[]; e.tags=e.tags.includes(tag)?e.tags.filter(t=>t!==tag):[...new Set([...e.tags,tag])]; S.save(true); renderEpDetail(id); }
function toggleRes(id,rid){ const e=S.E(id); if(!e)return; e.researchers=e.researchers||[]; e.researchers=e.researchers.includes(rid)?e.researchers.filter(r=>r!==rid):[...new Set([...e.researchers,rid])]; S.save(true); renderEpDetail(id); rEpList(); }
function delEp(id){ const e=S.E(id); conf('Excluir episódio','Remover "'+e?.title+'"? Esta ação não pode ser desfeita.',()=>{ S.dE(id); _selEp=null; rEpList(); document.getElementById('ep-detail').innerHTML='<div class="ep-detail-empty"><span>Episódio removido</span></div>'; ubadges(); toast('Episódio removido','s'); }); }
function addEp(){
  const maxOrd=Math.max(0,...S.data.episodes.map(e=>e.order||0));
  const id=S.uid();
  S.data.episodes.push({id,order:maxOrd+1,year:2027,month:'Jan',title:'Novo episódio',angle:'',researchers:[],tags:[],status:'pending',notes:'',questions:[],excerpts:[],published:{title:'',subtitle:'',intro:'',body:'',keywords:''}});
  S.save(true); ubadges(); rEpList(); selEp(id); toast('Episódio criado','s');
}
function swapOrder(id,toOrder){ const e=S.E(id); const other=S.data.episodes.find(x=>x.order===toOrder); if(!e||!other)return; const tmp=e.order; e.order=other.order; other.order=tmp; S.save(true); rEpList(); renderEpDetail(id); toast('Ordem atualizada','s'); }

// questions
S.uEarr = function(epId,field,idx,val){ const e=this.E(epId); if(e&&Array.isArray(e[field])){ e[field][idx]=val; this.save(); } };
function autoH(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function addQ(id){ const inp=document.getElementById('nq-'+id); if(!inp?.value.trim())return; const e=S.E(id); if(!e.questions)e.questions=[]; e.questions.push(inp.value.trim()); inp.value=''; S.save(true); renderEpTab(id); }
function delQ(id,i){ const e=S.E(id); if(!e)return; e.questions.splice(i,1); S.save(true); renderEpTab(id); }
function clearQs(id){ conf('Limpar perguntas','Remover todas as perguntas deste roteiro?',()=>{ S.uE(id,'questions',[]); renderEpTab(id); toast('Perguntas removidas','s'); }); }
function copyQ(id){ const e=S.E(id); if(!e)return; const txt=(e.questions||[]).map((q,i)=>`${i+1}. ${q}`).join('\n\n'); navigator.clipboard.writeText(txt).then(()=>toast('Copiado!','s')).catch(()=>toast('Erro ao copiar','e')); }

// excerpts
function addEx(id){ const t=document.getElementById('nex-t-'+id)?.value.trim(); if(!t)return; const sp=document.getElementById('nex-sp-'+id)?.value; const tag=document.getElementById('nex-tag-'+id)?.value; const e=S.E(id); if(!e.excerpts)e.excerpts=[]; e.excerpts.push({text:t,speaker:sp==='_outro'?'':sp,tag}); S.save(true); renderEpTab(id); }
function delEx(id,i){ const e=S.E(id); if(!e)return; e.excerpts.splice(i,1); S.save(true); renderEpTab(id); }

// publication
function upub(id,f,v){ const e=S.E(id); if(e){ if(!e.published)e.published={}; e.published[f]=v; S.save(); } }
function fmtPub(id,pre,pos){ const ta=document.getElementById('pub-ed-'+id); if(!ta)return; const s=ta.selectionStart,en=ta.selectionEnd,sel=ta.value.substring(s,en); ta.value=ta.value.substring(0,s)+pre+sel+pos+ta.value.substring(en); ta.focus(); ta.selectionStart=s+pre.length; ta.selectionEnd=s+pre.length+sel.length; upub(id,'body',ta.value); }
function genPubStruct(id){ const e=S.E(id); if(!e)return; const b=(e.questions||[]).map(q=>`P: ${q}\n\nR: `).join('\n\n---\n\n')||'P: [Pergunta]\n\nR: '; upub(id,'body',b); const ta=document.getElementById('pub-ed-'+id); if(ta)ta.value=b; toast('Estrutura gerada','s'); }
function cpPub(id){ const e=S.E(id); if(!e)return; const pub=e.published||{}; const txt=[pub.title||e.title,pub.subtitle||e.angle,'\n',pub.intro,'---\n',pub.body].filter(Boolean).join('\n').trim(); navigator.clipboard.writeText(txt).then(()=>toast('Copiado!','s')).catch(()=>toast('Erro','e')); }

let _pf='';
function rppl(){
  const q=norm(document.getElementById('ppl-q')?.value||'');
  let list=S.p.filter(p=>norm(p.name+p.org+p.country+p.type+p.city+p.region+(p.themes||[]).join(' ')).includes(q));
  if(_pf) list=list.filter(p=>p.type===_pf);

  const types=[...new Set(S.p.map(p=>p.type))];
  document.getElementById('ppl-filters').innerHTML=['all',...types].map(t=>`<button class="filt-btn${(_pf===t||(!_pf&&t==='all'))?' on':''}" onclick="setPF('${t}')">${t==='all'?'Todos':TL[t]||t}</button>`).join('');

  const stc={mapeado:'#c4bbb0',prioritário:'#8c5e08',contato:'#244060',agendado:'#8c5e08',entrevistado:'#2f5e3f','a confirmar':'#c4bbb0'};
  document.getElementById('ppl-grid').innerHTML=list.length?`
    <div style="grid-column:1/-1;font-size:12px;color:var(--muted)">${list.length} ator${list.length!==1?'es':''} · <span style="color:var(--sage)">${list.filter(p=>p.region==='Sul Global').length} Sul</span> · <span style="color:var(--slate)">${list.filter(p=>p.region==='Norte Global').length} Norte</span></div>
    ${list.map(p=>{const bg=clr(p.id); return`<div class="pc">
      <div class="pc-top">${pav(p,42)}<div style="flex:1;min-width:0">${tbdg(p.type)}<div class="pc-name" style="margin-top:3px">${san(p.name)}</div><div class="pc-org">${san(p.org)}</div><div class="pc-loc">📍 ${san(p.city||p.country||'—')}</div></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;min-height:20px;margin-bottom:9px">${(p.themes||[]).slice(0,3).map(t=>`<span style="font-size:10px;background:var(--cream2);color:var(--muted);padding:2px 7px;border-radius:10px">${san(t)}</span>`).join('')}</div>
      <div class="pc-foot">
        <span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:${stc[p.status]||'#c4bbb0'};display:inline-block"></span>${san(p.status)} · <span style="color:${p.region==='Sul Global'?'var(--sage)':'var(--slate)'}">${san(p.region||'')}</span></span>
        <div class="pc-acts">
          <button class="pca" onclick="openPModal('${san(p.id)}')">Editar</button>
          <button class="pca red" onclick="delP('${san(p.id)}')">×</button>
        </div>
      </div>
    </div>`; }).join('')}`
    :`<div class="empty" style="grid-column:1/-1">Nenhum resultado.<br><button class="btn acc sm" onclick="openPModal()" style="margin-top:12px">+ Cadastrar</button></div>`;
}
function setPF(t){ _pf=t==='all'?'':t; rppl(); }

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="closePModal()">Cancelar</button>
      ${id?`<button class="btn danger sm" onclick="delP('${san(id)}');closePModal()">Excluir</button>`:''}
      <button class="btn acc" onclick="saveP()">Salvar</button>
    </div>`;
  document.getElementById('pmod').classList.add('on');
}
function closePModal(){ document.getElementById('pmod').classList.remove('on'); _peid=null; }
function saveP(){
  const name=document.getElementById('pf-name')?.value.trim();
  if(!name){ toast('Nome é obrigatório','e'); return; }
  const id=_peid||S.uid();
  const person={id,name,org:document.getElementById('pf-org').value.trim(),type:document.getElementById('pf-type').value,country:document.getElementById('pf-country').value.trim(),city:document.getElementById('pf-city').value.trim(),region:document.getElementById('pf-region').value,status:document.getElementById('pf-status').value,priority:document.getElementById('pf-prio').value,email:document.getElementById('pf-email').value.trim(),orcid:document.getElementById('pf-orcid').value.trim(),photo:document.getElementById('pf-photo').value.trim(),themes:document.getElementById('pf-themes').value.split(',').map(s=>s.trim()).filter(Boolean),bio:document.getElementById('pf-bio').value.trim(),pubs:document.getElementById('pf-pubs').value.trim(),notes:document.getElementById('pf-notes').value.trim(),lat:S.P(id)?.lat||0,lng:S.P(id)?.lng||0};
  if(_peid){ const i=S.p.findIndex(x=>x.id===_peid); if(i>=0)S.p[i]=person; }else S.p.push(person);
  S.save(true); closePModal(); rppl(); ubadges();
  if(_selEp) renderEpDetail(_selEp); // refresh if in ep detail
  toast(name+(_peid?' atualizado(a)':' cadastrado(a)'),'s');
}
function delP(id){ const p=S.P(id); conf('Excluir pessoa','Remover "'+p?.name+'"?',()=>{ S.dP(id); rppl(); ubadges(); if(_selEp) renderEpDetail(_selEp); toast('Removido(a)','s'); }); }

const SB_URL = 'https://ngeogbbsvohgscyeqbvr.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZW9nYmJzdm9oZ3NjeWVxYnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDk1NTcsImV4cCI6MjA5MDYyNTU1N30._ajMoa521ijfoFcSlLxH6htzGGZRRS32mzoLIWg7V5k';
let _sb=null,_sbOn=false,_sbCh=null,_sbLast=null;

function sbStat(type,msg){
  const bar=document.getElementById('syncbar'),dot=document.getElementById('sdot'),span=document.getElementById('smsg');
  if(!bar)return;
  bar.classList.add('on');
  dot.className='sdot'+(type==='ok'?' pulse':type==='err'?' err':' saving');
  span.textContent=msg;
  if(_sbLast)document.getElementById('stime').textContent=_sbLast.toLocaleTimeString('pt-BR');
  bar.style.background=type==='err'?'#5a1010':type==='saving'?'#2a2015':'';
  if(type==='ok')setTimeout(()=>{if(bar)bar.style.background='';},2000);
}

async function sbConnect(){
  sbStat('saving','Conectando…');
  try{
    _sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const {error}=await _sb.from('cm_people').select('id').limit(1);
    if(error&&!['PGRST116','42P01'].includes(error.code)) throw new Error(error.message);
    _sbOn=true;
    await sbLoad();
    sbRealtime();
    sbStat('ok','✓ Conectado ao Supabase');
  }catch(e){
    _sb=null;_sbOn=false;
    sbStat('err','Erro: '+e.message+' — toque ↻');
    console.error('[SB]',e);
  }
}

async function sbLoad(){
  try{
    const [pR,eR]=await Promise.all([
      _sb.from('cm_people').select('*').order('id'),
      _sb.from('cm_episodes').select('*').order('ep_order'),
    ]);
    if(pR.error)throw pR.error;
    if(eR.error)throw eR.error;
    S.data.people=(pR.data||[]).map(r=>({id:r.id,name:r.name,org:r.org||'',type:r.type||'other',country:r.country||'',city:r.city||'',region:r.region||'',lat:r.lat||0,lng:r.lng||0,photo:r.photo||'',email:r.email||'',orcid:r.orcid||'',priority:r.priority||'média',status:r.status||'mapeado',bio:r.bio||'',pubs:r.pubs||'',themes:Array.isArray(r.themes)?r.themes:[],notes:r.notes||''}));
    S.data.episodes=(eR.data||[]).map(r=>({id:r.id,order:r.ep_order||1,year:r.year||2026,month:r.month||'Jan',title:r.title||'',angle:r.angle||'',status:r.status||'pending',tags:Array.isArray(r.tags)?r.tags:[],researchers:Array.isArray(r.researchers)?r.researchers:[],notes:r.notes||'',questions:Array.isArray(r.questions)?r.questions:[],excerpts:Array.isArray(r.excerpts)?r.excerpts:[],published:r.published||{}}));
    _sbLast=new Date();
    sbStat('ok','✓ Dados carregados · '+_sbLast.toLocaleTimeString('pt-BR'));
    rerender();
  }catch(e){ sbStat('err','Erro ao carregar: '+e.message); }
}

function rerender(){
  if(_pg==='dash')rdash();
  if(_pg==='eps'){rEpList();if(_selEp)renderEpDetail(_selEp);}
  if(_pg==='ppl')rppl();
  ubadges();
}

function sbRealtime(){
  if(!_sb||_sbCh)return;
  _sbCh=_sb.channel('cm_v5')
    .on('postgres_changes',{event:'*',schema:'public',table:'cm_people'},()=>sbLoad())
    .on('postgres_changes',{event:'*',schema:'public',table:'cm_episodes'},()=>sbLoad())
    .subscribe(st=>{ if(st==='SUBSCRIBED')sbStat('ok','Realtime ativo'); if(st==='CHANNEL_ERROR')sbStat('err','Erro realtime'); });
}

async function sbWrite(){
  if(!_sbOn||!_sb)return;
  sbStat('saving','Salvando…');
  try{
    const pr=await Promise.allSettled([
      S.data.people.length?_sb.from('cm_people').upsert(S.data.people.map(p=>({id:p.id,name:p.name,org:p.org||'',type:p.type||'other',country:p.country||'',city:p.city||'',region:p.region||'',lat:p.lat||0,lng:p.lng||0,photo:p.photo||'',email:p.email||'',orcid:p.orcid||'',priority:p.priority||'média',status:p.status||'mapeado',bio:p.bio||'',pubs:p.pubs||'',themes:p.themes||[],notes:p.notes||''})),{onConflict:'id'}):Promise.resolve({error:null}),
      S.data.episodes.length?_sb.from('cm_episodes').upsert(S.data.episodes.map(e=>({id:e.id,ep_order:e.order||1,year:e.year||2026,month:e.month||'Jan',title:e.title||'',angle:e.angle||'',status:e.status||'pending',tags:e.tags||[],researchers:e.researchers||[],notes:e.notes||'',questions:e.questions||[],excerpts:e.excerpts||[],published:e.published||{}})),{onConflict:'id'}):Promise.resolve({error:null}),
    ]);
    const errs=pr.filter(r=>r.status==='fulfilled'&&r.value?.error).map(r=>r.value.error.message);
    if(errs.length){sbStat('err','Erro: '+errs[0]);toast('Erro Supabase: '+errs[0],'e');}
    else{_sbLast=new Date();sbStat('ok','✓ Salvo · '+_sbLast.toLocaleTimeString('pt-BR'));}
  }catch(e){sbStat('err','Erro: '+e.message);}
}

async function sbSync(){ if(!_sbOn){await sbConnect();}else{sbStat('saving','Sincronizando…');await sbLoad();} }
function sbDisc(){ if(_sbCh&&_sb)_sb.removeChannel(_sbCh); _sb=null;_sbOn=false;_sbCh=null; document.getElementById('syncbar').classList.remove('on'); toast('Desconectado','w'); }

  S.load();
  rdash();
  rEpList();
  rppl();
  ubadges();
  sbConnect();
}
init();
