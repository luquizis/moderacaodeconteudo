<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderation Intelligence OS · DigiLabour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────────── */
:root{
  --ink:#0e0d0c;--ink2:#2a2826;--ink3:#4a4845;
  --smoke:#f9f7f5;--smoke2:#f2efeb;--smoke3:#e8e3dc;
  --vinho:#5c1010;--vinho2:#7a1a1a;--vinho-pale:#fdf0f0;--vinho-light:#f5dede;
  --gold:#8a6a1a;--gold-light:#fdf6e3;
  --teal:#0a5c4a;--teal-light:#e3f5f0;
  --blue:#1a3a6c;--blue-light:#e3eaf5;
  --border:#ddd8d0;--border2:#c8c2b8;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,.1),0 1px 4px rgba(0,0,0,.06);
  --r:8px;--r-lg:12px;--r-xl:16px;
  --nav-h:56px;--sidebar-w:300px;--panel-w:480px;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--smoke);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--smoke3);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* ── TOPNAV ── */
#topnav{
  height:var(--nav-h);background:var(--vinho);
  display:flex;align-items:center;padding:0 20px;gap:0;
  position:relative;z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{
  display:flex;flex-direction:column;padding-right:20px;
  border-right:1px solid rgba(255,255,255,.15);margin-right:16px;
}
.brand-title{font-family:var(--font-display);font-size:15px;color:#fff;letter-spacing:.3px;line-height:1.1}
.brand-sub{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px}
.nav-pills{display:flex;gap:2px}
.nav-pill{
  padding:7px 13px;border-radius:6px;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.55);cursor:pointer;transition:all .18s;
  text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;
  border:none;background:transparent;font-family:var(--font-body);
}
.nav-pill:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.07)}
.nav-pill.active{color:#fff;background:rgba(255,255,255,.15)}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-btn{
  padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);
  font-family:var(--font-body);transition:all .15s;letter-spacing:.3px;
}
.nav-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.save-flash{font-size:11px;color:rgba(255,255,255,.5);opacity:0;transition:opacity .3s;margin-right:4px}
.save-flash.on{opacity:1}

/* ── PAGES ── */
.page{display:none;height:calc(100vh - var(--nav-h));overflow:hidden}
.page.active{display:flex}

/* ══════════════════════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════════════════════ */
#page-dash{flex-direction:column;overflow-y:auto;padding:32px 36px}
.dash-header{margin-bottom:28px}
.dash-title{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--ink);line-height:1.2}
.dash-sub{font-size:13px;color:var(--ink3);margin-top:4px}
.metrics-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
.metric-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px 18px;position:relative;overflow:hidden;
}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--vinho)}
.metric-val{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--ink);line-height:1}
.metric-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-top:6px}
.metric-sub{font-size:11px;color:var(--ink3);margin-top:3px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.dash-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px}
.dash-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--vinho);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.timeline-wrap{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--smoke2)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.tl-dot-pending{background:var(--smoke3)}
.tl-dot-scheduled{background:#e09a20}
.tl-dot-done{background:var(--teal)}
.tl-dot-published{background:var(--blue)}
.tl-info{flex:1}
.tl-title{font-size:13px;font-weight:500;line-height:1.3}
.tl-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.tl-date{font-size:11px;font-weight:600;color:var(--vinho);white-space:nowrap;font-family:var(--font-mono)}
.progress-bar-wrap{margin-bottom:12px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.progress-bar{height:6px;background:var(--smoke3);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;background:var(--vinho);transition:width .4s}
.status-grid{display:flex;flex-direction:column;gap:8px}
.status-row{display:flex;align-items:center;gap:10px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-name{font-size:13px;flex:1}
.status-count{font-size:13px;font-weight:600;font-family:var(--font-mono)}

/* ══════════════════════════════════════════════════════════════════
   MAP
══════════════════════════════════════════════════════════════════ */
#page-map{position:relative}
#map{flex:1;height:100%}
.leaflet-container{background:#d4e4f0}
.map-sidebar{
  width:var(--sidebar-w);height:100%;background:#fff;
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  flex-shrink:0;
}
.map-sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--smoke)}
.map-sidebar-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--vinho);margin-bottom:8px}
.map-search{
  width:100%;padding:8px 10px;border:1px solid var(--border);
  border-radius:var(--r);font-size:13px;font-family:var(--font-body);
  background:#fff;
}
.map-search:focus{outline:none;border-color:var(--vinho)}
.map-list{flex:1;overflow-y:auto}
.map-person-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  cursor:pointer;border-bottom:1px solid var(--smoke2);transition:background .12s;
}
.map-person-item:hover{background:var(--smoke)}
.map-person-item.active{background:var(--vinho-pale);border-left:3px solid var(--vinho)}
.map-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;overflow:hidden;
  border:2px solid var(--smoke3);
}
.map-avatar img{width:100%;height:100%;object-fit:cover}
.map-person-name{font-size:13px;font-weight:500;line-height:1.2}
.map-person-org{font-size:11px;color:var(--ink3);margin-top:1px}
/* map panel */
#map-panel{
  position:absolute;top:0;right:0;width:var(--panel-w);height:100%;
  background:#fff;border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:800;display:flex;flex-direction:column;
  box-shadow:-8px 0 32px rgba(0,0,0,.08);
}
#map-panel.open{transform:translateX(0)}
.panel-hero{
  background:var(--vinho);padding:22px 22px 18px;color:#fff;
  display:flex;gap:14px;align-items:flex-start;flex-shrink:0;
}
.panel-hero-photo{
  width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.3);
  flex-shrink:0;object-fit:cover;background:var(--vinho2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:rgba(255,255,255,.9);overflow:hidden;
}
.panel-hero-photo img{width:100%;height:100%;object-fit:cover}
.panel-hero-name{font-family:var(--font-display);font-size:18px;font-weight:500;line-height:1.2;margin-bottom:3px}
.panel-hero-org{font-size:12px;color:rgba(255,255,255,.65)}
.panel-hero-loc{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;display:flex;align-items:center;gap:4px}
.panel-close{margin-left:auto;cursor:pointer;color:rgba(255,255,255,.6);font-size:22px;line-height:1;padding:0 2px;flex-shrink:0}
.panel-close:hover{color:#fff}
.panel-inner-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--smoke);flex-shrink:0}
.pit{flex:1;padding:9px 4px;font-size:11px;font-weight:600;text-align:center;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.pit:hover{color:var(--ink)}
.pit.active{color:var(--vinho);border-bottom-color:var(--vinho);background:#fff}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px}
.panel-section-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--vinho);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pub-item{
  padding:10px 12px;background:var(--smoke);border:1px solid var(--border);
  border-left:3px solid var(--vinho);border-radius:0 var(--r) var(--r) 0;
  margin-bottom:8px;font-size:13px;line-height:1.6;
}
.ep-link-item{
  padding:10px 12px;background:var(--smoke);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:border-color .15s;
}
.ep-link-item:hover{border-color:var(--vinho)}
.ep-link-date{font-size:10px;font-weight:600;color:var(--vinho);font-family:var(--font-mono);margin-bottom:2px}
.ep-link-title{font-size:13px;font-weight:500}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;margin:2px}
.tag-w{background:var(--gold-light);color:var(--gold)}
.tag-g{background:var(--vinho-pale);color:var(--vinho)}
.tag-a{background:var(--teal-light);color:var(--teal)}
.tag-s{background:var(--blue-light);color:var(--blue)}
.tag-j{background:#f0f0f0;color:#444}

/* custom leaflet marker */
.lf-marker{cursor:pointer;transition:transform .2s}
.lf-marker:hover{transform:scale(1.1) translateY(-3px)}
.lf-bubble{
  width:46px;height:46px;border-radius:50%;
  border:3px solid #fff;box-shadow:0 3px 14px rgba(0,0,0,.28);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
}
.lf-bubble img{width:100%;height:100%;object-fit:cover}
.lf-pin-line{width:2px;height:12px;margin:0 auto}
.lf-pin-dot{width:6px;height:6px;border-radius:50%;margin:0 auto}
.lf-label{
  margin-top:4px;font-size:9px;font-weight:700;
  background:rgba(255,255,255,.93);color:var(--ink);
  padding:2px 6px;border-radius:10px;white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.12);text-align:center;
  font-family:var(--font-body);letter-spacing:.2px;
}

/* ══════════════════════════════════════════════════════════════════
   DOSSIER
══════════════════════════════════════════════════════════════════ */
#page-dossier{flex-direction:row}
.dos-sidebar{width:var(--sidebar-w);border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;flex-shrink:0}
.dos-sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--smoke);flex-shrink:0}
.dos-list{flex:1;overflow-y:auto}
.dos-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--smoke2);transition:background .12s}
.dos-item:hover{background:var(--smoke)}
.dos-item.active{background:var(--vinho-pale);border-left:3px solid var(--vinho)}
.dos-content{flex:1;overflow-y:auto;padding:28px 32px;background:var(--smoke)}
.dos-hero{display:flex;gap:20px;align-items:flex-start;margin-bottom:22px}
.dos-photo{width:72px;height:72px;border-radius:50%;border:3px solid var(--vinho-light);flex-shrink:0;object-fit:cover;background:var(--vinho2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;overflow:hidden}
.dos-photo img{width:100%;height:100%;object-fit:cover}
.dos-name{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.2;margin-bottom:4px}
.dos-org{font-size:13px;color:var(--ink3)}
.dos-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dos-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px}
.dos-card.full{grid-column:1/-1}
.dos-card-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--vinho);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.field-group{margin-bottom:10px}
.field-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:3px}
.field-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:var(--font-body);background:var(--smoke);color:var(--ink);transition:border-color .15s}
.field-input:focus{outline:none;border-color:var(--vinho);background:#fff}
.field-ta{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:var(--font-body);background:var(--smoke);color:var(--ink);resize:vertical;line-height:1.6;transition:border-color .15s}
.field-ta:focus{outline:none;border-color:var(--vinho);background:#fff}
.field-select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:var(--font-body);background:var(--smoke);color:var(--ink);cursor:pointer}
.field-select:focus{outline:none;border-color:var(--vinho)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.relation-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--smoke2);font-size:13px}
.relation-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.btn{padding:8px 16px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:#fff;color:var(--ink);font-family:var(--font-body);transition:all .15s;letter-spacing:.2px}
.btn:hover{background:var(--smoke)}
.btn-vinho{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.btn-vinho:hover{background:var(--vinho2)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ══════════════════════════════════════════════════════════════════
   INTERVIEWS
══════════════════════════════════════════════════════════════════ */
#page-interview{flex-direction:row}
.int-sidebar{width:var(--sidebar-w);border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;flex-shrink:0}
.int-content{flex:1;overflow-y:auto;padding:0;background:var(--smoke)}
.int-content-inner{padding:28px 32px;max-width:900px}
.int-tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0}
.int-tab{padding:11px 18px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.int-tab:hover{color:var(--ink)}
.int-tab.active{color:var(--vinho);border-bottom-color:var(--vinho)}
.int-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px}
.int-card-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--vinho);margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.sb-planejada{background:#f0f0f0;color:#555}
.sb-agendada{background:#fef3d7;color:#7a4500}
.sb-realizada{background:var(--teal-light);color:var(--teal)}
.sb-transcrita{background:var(--blue-light);color:var(--blue)}
.sb-codificada{background:var(--vinho-pale);color:var(--vinho)}
.q-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--smoke);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px}
.q-n{font-size:11px;font-weight:700;color:var(--vinho);min-width:22px;margin-top:2px;font-family:var(--font-mono)}
.q-text{flex:1;font-size:13px;line-height:1.6;outline:none}
.q-text:focus{border-bottom:1px dashed var(--vinho)}
.q-del{color:var(--smoke3);cursor:pointer;font-size:16px;padding:0 2px}
.q-del:hover{color:#b00}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-inp{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:var(--font-body);background:#fff}
.add-inp:focus{outline:none;border-color:var(--vinho)}
.excerpt-item{background:#fff;border:1px solid var(--border);border-left:3px solid var(--vinho);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:10px}
.ex-meta{font-size:11px;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-text{font-size:13px;line-height:1.75;font-style:italic;color:var(--ink2)}
.ai-box{background:linear-gradient(135deg,var(--vinho-pale),var(--smoke));border:1px solid var(--vinho-light);border-radius:var(--r-lg);padding:18px 20px}
.ai-box-h{font-size:11px;font-weight:700;color:var(--vinho);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ai-badge{background:var(--vinho);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.5px}
.ai-output{font-size:13px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;min-height:60px}
.ai-spinner{display:none;align-items:center;gap:8px;color:var(--ink3);font-size:13px}
.ai-spinner.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid var(--smoke3);border-top-color:var(--vinho);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════════════════════════
   ANALYSIS
══════════════════════════════════════════════════════════════════ */
#page-analysis{flex-direction:row}
.ana-sidebar{width:var(--sidebar-w);border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;flex-shrink:0}
.ana-content{flex:1;overflow-y:auto;padding:28px 32px;background:var(--smoke)}
.code-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin:2px;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.code-chip.selected{border-color:currentColor}
.matrix-table{width:100%;border-collapse:collapse;font-size:13px}
.matrix-table th{text-align:left;padding:9px 12px;background:var(--smoke2);border-bottom:2px solid var(--border);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3)}
.matrix-table td{padding:9px 12px;border-bottom:1px solid var(--border)}
.matrix-table tr:hover td{background:var(--smoke)}

function loadData(){
  try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_DATA));}
  catch{return JSON.parse(JSON.stringify(DEFAULT_DATA));}
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA));
  const f=document.getElementById('save-flash');
  f.classList.add('on');setTimeout(()=>f.classList.remove('on'),1800);
}
function exportJSON(){
  const b=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mios-v4.json';a.click();
}
function exportCSV(){
  const rows=[['id','name','org','type','country','region','priority','status','episodeDate','episodeTitle'],...DATA.people.map(p=>[p.id,p.name,p.org,p.type,p.country,p.region,p.priority,p.status,p.episodeDate||'',p.episodeTitle||''])];
  const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mios-v4.csv';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{DATA=JSON.parse(ev.target.result);save();init();}catch{alert('Arquivo inválido.');}};r.readAsText(f);
}
function resetDemo(){if(confirm('Redefinir para os dados padrão?')){localStorage.removeItem(STORAGE_KEY);location.reload();}}

function switchPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-pill').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');

  if(id==='map'&&map){setTimeout(()=>map.invalidateSize(),80);}
  if(id==='dash')renderDash();
  if(id==='dossier')renderDosList();
  if(id==='interview')renderIntList();

  if(id==='blog')renderBlogList();
}

// HELPERS
// ══════════════════════════════════════════════════════════════════
function initials(name){return name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function avatarColor(id){return AVATAR_COLORS[id.charCodeAt?.(0)%AVATAR_COLORS.length||0];}
function avatarHTML(p,size=36){
  const c=avatarColor(p.id);
  if(p.photo) return `<img src="${p.photo}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover">`;
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.3)}px;font-weight:700">${initials(p.name)}</div>`;
}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');}
function epColors(){return['#5c1010','#1a3a6c','#0a5c4a','#8a6a1a','#3d1a5c','#1a5c3a','#5c3a1a'];}
function epColor(ep){return epColors()[(ep.id-1)%epColors().length];}
function stDot(st){
  const m={pending:'#ccc',scheduled:'#e09a20',done:'#0a5c4a',published:'#1a3a6c',
    planejada:'#ccc',agendada:'#e09a20',realizada:'#0a5c4a',transcrita:'#1a3a6c',codificada:'#5c1010'};
  return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${m[st]||'#ccc'}"></span>`;
}
function tagBadges(tags){return(tags||[]).map(t=>`<span class="tag-pill tag-${t}">${TAG_LABELS[t]||t}</span>`).join('');}

function renderDash(){
  const eps=DATA.episodes, ppl=DATA.people, ints=DATA.interviews;
  const done=eps.filter(e=>['done','published'].includes(e.status)).length;
  const sched=eps.filter(e=>e.status==='scheduled').length;
  const totalQ=eps.reduce((a,e)=>a+(e.questions?.length||0),0);
  const totalEx=eps.reduce((a,e)=>a+(e.excerpts?.length||0),0);

  const tl=eps.slice(0,6).map(ep=>{
    const dotCls=`tl-dot-${ep.status==='done'||ep.status==='published'?ep.status:ep.status==='scheduled'?'scheduled':'pending'}`;
    const res=ep.researchers.map(rid=>{const r=DATA.people.find(x=>x.id===rid);return r?r.name.split(' ')[0]:'';}).filter(Boolean).join(', ')||'A confirmar';
    return `<div class="tl-item">
      <span class="tl-dot ${dotCls}"></span>
      <div class="tl-info">
        <div class="tl-title">${ep.title}</div>
        <div class="tl-meta">${res}</div>
      </div>
      <div class="tl-date">${ep.month} ${ep.year}</div>
    </div>`;
  }).join('');

  const byStatus=[
    {label:'Pendentes',color:'#ccc',count:eps.filter(e=>e.status==='pending').length},
    {label:'Agendadas',color:'#e09a20',count:eps.filter(e=>e.status==='scheduled').length},
    {label:'Realizadas',color:'#0a5c4a',count:eps.filter(e=>e.status==='done').length},
    {label:'Publicadas',color:'#1a3a6c',count:eps.filter(e=>e.status==='published').length},
  ];

  const byRegion=[
    {label:'Sul Global',count:ppl.filter(p=>p.region==='Sul Global').length},
    {label:'Norte Global',count:ppl.filter(p=>p.region==='Norte Global').length},
  ];

  document.getElementById('dash-body').innerHTML=`
    <div style="max-width:1100px;padding:32px 36px">
      <div class="dash-header">
        <div class="dash-title">Quem Modera o Mundo?</div>
        <div class="dash-sub">Série DigiLabour · 12 episódios · 2026–2027 · Perspectiva comparativa Sul–Norte</div>
      </div>
      <div class="metrics-row">
        <div class="metric-card"><div class="metric-val">${eps.length}</div><div class="metric-label">Episódios</div><div class="metric-sub">6 por ano</div></div>
        <div class="metric-card"><div class="metric-val">${ppl.length}</div><div class="metric-label">Pesquisadores</div><div class="metric-sub">${byRegion[0].count} Sul · ${byRegion[1].count} Norte</div></div>
        <div class="metric-card"><div class="metric-val">${done}</div><div class="metric-label">Realizados</div><div class="metric-sub">${sched} agendados</div></div>
        <div class="metric-card"><div class="metric-val">${totalQ}</div><div class="metric-label">Perguntas</div><div class="metric-sub">No roteiro</div></div>
        <div class="metric-card"><div class="metric-val">${totalEx}</div><div class="metric-label">Trechos</div><div class="metric-sub">Codificados</div></div>
      </div>
      <div class="dash-grid">
        <div class="dash-card">
          <div class="dash-card-title">Linha do tempo editorial</div>
          <div class="timeline-wrap">${tl}</div>
        </div>
        <div class="dash-card">
          <div class="dash-card-title">Progresso da série</div>
          <div class="progress-bar-wrap">
            <div class="progress-label"><span>Episódios concluídos</span><span>${done}/${eps.length}</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(done/eps.length*100)}%"></div></div>
          </div>
          <div class="progress-bar-wrap" style="margin-top:16px">
            <div class="progress-label"><span>Perguntas elaboradas</span><span>${totalQ}</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,Math.round(totalQ/eps.length*100/5))}%;background:#1a3a6c"></div></div>
          </div>
          <div class="divider"></div>
          <div class="status-grid">
            ${byStatus.map(s=>`<div class="status-row"><div class="status-dot" style="background:${s.color}"></div><div class="status-name">${s.label}</div><div class="status-count">${s.count}</div></div>`).join('')}
          </div>
          <div class="divider"></div>
          <div class="dash-card-title" style="margin-top:4px">Por tipo de pesquisador</div>
          ${['academic','ngo','journalist'].map(t=>{const c=ppl.filter(p=>p.type===t).length;return `<div class="status-row" style="margin-bottom:6px"><div class="status-dot" style="background:var(--vinho)"></div><div class="status-name">${t}</div><div class="status-count">${c}</div></div>`;}).join('')}
        </div>
      </div>
    </div>`;
}

function initMap(){
  map=L.map('map',{center:[15,10],zoom:2,zoomControl:true,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
  L.control.attribution({prefix:'© CartoDB · OpenStreetMap'}).addTo(map);
  renderMapMarkers();
  renderMapSidebar();
}
function renderMapMarkers(){
  Object.values(mapMarkers).forEach(m=>map.removeLayer(m));
  mapMarkers={};
  DATA.people.forEach(p=>{
    if(!p.lat&&!p.lng)return;
    const c=avatarColor(p.id);
    const photoHtml=p.photo?`<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      :`<span style="font-size:13px;font-weight:700;color:#fff">${initials(p.name)}</span>`;
    const icon=L.divIcon({
      className:'lf-marker',
      html:`<div style="display:flex;flex-direction:column;align-items:center">
        <div class="lf-bubble" style="background:${c}">${photoHtml}</div>
        <div class="lf-pin-line" style="background:${c}"></div>
        <div class="lf-pin-dot" style="background:${c}"></div>
        <div class="lf-label">${p.name.split(' ')[0]}</div>
      </div>`,
      iconSize:[80,92],iconAnchor:[40,74],
    });
    const m=L.marker([p.lat,p.lng],{icon}).addTo(map).on('click',()=>openMapPanel(p.id));
    mapMarkers[p.id]=m;
  });
}
function renderMapSidebar(){
  const q=norm(document.getElementById('map-search')?.value||'');
  const list=DATA.people.filter(p=>norm(p.name+p.org+p.country).includes(q));
  document.getElementById('map-list').innerHTML=list.map(p=>`
    <div class="map-person-item${selPerson===p.id?' active':''}" onclick="openMapPanel('${p.id}')">
      ${avatarHTML(p,38)}

        <div class="map-person-name">${p.name}</div>
        <div class="map-person-org">${p.city||''}, ${p.country||''}</div>
      </div>
    </div>`).join('')||'<div class="empty">Nenhum resultado</div>';
}

  selPerson=id;

  const c=avatarColor(p.id);

function switchMapPanelTab(t){

function renderIntList(){
  const q=norm(document.getElementById('int-search')?.value||'');

  const epItems=DATA.episodes.map(ep=>{

    </div>`;}).join('')}`:''}`;
}

        <select style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-family:var(--font-body)" onchange="updEp(${ep.id},'status',this.value)">

function switchIntTab(mode,id,tab){

      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--smoke);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px">

function updEp(epId,field,val){const ep=DATA.episodes.find(e=>e.id===epId);if(ep)ep[field]=val;save();}

function delEpQ(epId,i){const ep=DATA.episodes.find(e=>e.id===epId);if(ep){ep.questions.splice(i,1);save();renderEpTab(epId);}}
function addEpQ(epId){const inp=document.getElementById('new-q-'+epId);if(!inp?.value.trim())return;const ep=DATA.episodes.find(e=>e.id===epId);ep.questions.push(inp.value.trim());inp.value='';save();renderEpTab(epId);}
function addEpEx(epId){const t=document.getElementById('new-ex-'+epId)?.value.trim();if(!t)return;const ep=DATA.episodes.find(e=>e.id===epId);ep.excerpts.push({text:t,speaker:document.getElementById('new-ex-sp-'+epId)?.value.trim()||'',tag:document.getElementById('new-ex-tag-'+epId)?.value||''});save();renderEpTab(epId);}
function delEpEx(epId,i){const ep=DATA.episodes.find(e=>e.id===epId);if(ep){ep.excerpts.splice(i,1);save();renderEpTab(epId);}}
function addAtt(epId){const n=document.getElementById('att-n-'+epId)?.value.trim();if(!n)return;const ep=DATA.episodes.find(e=>e.id===epId);if(!ep.attachments)ep.attachments=[];ep.attachments.push({name:n,type:document.getElementById('att-t-'+epId)?.value,url:document.getElementById('att-u-'+epId)?.value.trim()});save();renderEpTab(epId);}
function delAtt(epId,i){const ep=DATA.episodes.find(e=>e.id===epId);if(ep){ep.attachments.splice(i,1);save();renderEpTab(epId);}}
function toggleEpRes(epId,rid,checked){const ep=DATA.episodes.find(e=>e.id===epId);if(!ep)return;ep.researchers=checked?[...new Set([...ep.researchers,rid])]:ep.researchers.filter(r=>r!==rid);}

document.getElementById('int-content').innerHTML=`

      </div>
      <div class="int-card">
        <div class="int-card-h">Novo código</div>
        <div style="display:flex;gap:10px;margin-bottom:8px">
          <input class="field-input" id="new-code-n" placeholder="Nome do código" style="flex:2">
          <input class="field-input" id="new-code-c" placeholder="#5c1010" style="flex:1">
        </div>
        <textarea class="field-ta" id="new-code-d" rows="2" placeholder="Definição"></textarea>
        <div class="btn-row"><button class="btn btn-vinho" onclick="addCode()">+ Adicionar código</button></div>
      </div>`;
  } else if(tab==='matrix'){
    const matrix=DATA.people.map(p=>{
      const total=all.filter(e=>e.speaker===p.name).length;
      const byCode=DATA.codes.map(code=>all.filter(e=>e.speaker===p.name&&(e.codeIds||[]).includes(code.id)).length);
      return {p,total,byCode};
    }).filter(r=>r.total>0||DATA.episodes.some(e=>e.researchers.includes(r.p.id)));
    c.innerHTML=`<div class="int-card"><div class="int-card-h">Matriz de casos</div>
      <div style="overflow-x:auto"><table class="matrix-table">
        <thead><tr><th>Pesquisador(a)</th><th>Tipo</th><th>Região</th><th>Trechos</th>${DATA.codes.map(code=>`<th class="heat-cell">${code.name.split(' ')[0]}</th>`).join('')}</tr></thead>
        <tbody>${DATA.people.filter(p=>DATA.episodes.some(e=>e.researchers.includes(p.id))).map(p=>{
          const total=all.filter(e=>e.speaker===p.name).length;
          const byCode=DATA.codes.map(code=>{const n=all.filter(e=>e.speaker===p.name&&(e.codeIds||[]).includes(code.id)).length;return n>0?`<td class="heat-cell" style="background:${code.color}${Math.min(255,n*40).toString(16).padStart(2,'0')}">${n}</td>`:`<td class="heat-cell" style="color:var(--ink3)">—</td>`;});
          return `<tr><td style="font-weight:500">${p.name}</td><td>${p.type}</td><td>${p.region||'—'}</td><td style="font-weight:600;color:var(--vinho)">${total}</td>${byCode.join('')}</tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  } else if(tab==='graph'){
    c.innerHTML=`<div class="int-card"><div class="int-card-h">Grafo de relações entre pesquisadores e temas</div>
      <svg id="graph-canvas" width="100%" height="500"></svg>
    </div>`;
    setTimeout(()=>renderD3Graph(),50);
  }
}
function renderAnaList(){
  const all=[];DATA.episodes.forEach(ep=>ep.excerpts.forEach((ex,i)=>all.push({...ex,epId:ep.id,epTitle:ep.title,idx:i})));
  const q=norm(document.getElementById('ana-search')?.value||'');
  const list=all.filter(ex=>norm(ex.text+ex.speaker+ex.epTitle).includes(q));
  const tabs=['excerpts','codes','matrix','graph'];
  const tabNames={excerpts:'Todos os trechos',codes:'Livro de códigos',matrix:'Matriz de casos',graph:'Grafo de relações'};
  document.getElementById('ana-list').innerHTML=
    tabs.map(t=>`<div class="s-item${anaTab===t?' active':''}" onclick="openAnaTab('${t}')" style="padding:12px 14px">
      <div><div class="s-name">${tabNames[t]}</div></div>
    </div>`).join('')+
    (list.length?`<div style="padding:8px 14px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);border-top:1px solid var(--border);margin-top:4px">Trechos</div>`+
    list.map(ex=>`<div class="s-item">
      <div style="font-size:10px;font-weight:700;color:var(--vinho);min-width:28px">Ep.${ex.epId}</div>
      <div style="min-width:0"><div class="s-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.text.substring(0,55)}…</div><div class="s-sub">${ex.speaker||'—'}</div></div>
    </div>`).join(''):'');
}
function toggleCode(epId,idx,codeId){
  const ep=DATA.episodes.find(e=>e.id===epId);if(!ep)return;
  const ex=ep.excerpts[idx];if(!ex)return;
  ex.codeIds=ex.codeIds||[];
  ex.codeIds=ex.codeIds.includes(codeId)?ex.codeIds.filter(x=>x!==codeId):[...new Set([...ex.codeIds,codeId])];
  save();openAnaTab('excerpts');
}
function updCode(id,f,v){const c=DATA.codes.find(x=>x.id===id);if(c)c[f]=v;save();}
function delCode(id){if(!confirm('Remover código?'))return;DATA.codes=DATA.codes.filter(c=>c.id!==id);DATA.episodes.forEach(ep=>ep.excerpts.forEach(ex=>{ex.codeIds=(ex.codeIds||[]).filter(c=>c!==id);}));save();openAnaTab('codes');}
function addCode(){const n=document.getElementById('new-code-n')?.value.trim();if(!n)return;DATA.codes.push({id:'c-'+Date.now(),name:n,color:document.getElementById('new-code-c')?.value.trim()||'#5c1010',definition:document.getElementById('new-code-d')?.value.trim()||''});save();openAnaTab('codes');}
function renderD3Graph(){
  const svg=document.getElementById('graph-canvas');if(!svg)return;
  const W=svg.clientWidth,H=500;
  const d3svg=d3.select(svg);d3svg.selectAll('*').remove();
  const nodes=[],links=[];
  const themes=Object.keys(TAG_LABELS);
  themes.forEach(t=>nodes.push({id:'t-'+t,type:'theme',label:TAG_LABELS[t],color:TAG_COLORS[t],r:20}));
  DATA.episodes.forEach(ep=>{
    nodes.push({id:'ep-'+ep.id,type:'ep',label:`${ep.id}`,title:ep.title,color:epColor(ep),r:16});
    ep.tags.forEach(t=>links.push({source:'ep-'+ep.id,target:'t-'+t,type:'theme'}));
    ep.researchers.forEach(rid=>{
      const p=DATA.people.find(x=>x.id===rid);if(!p)return;
      if(!nodes.find(n=>n.id==='p-'+rid))nodes.push({id:'p-'+rid,type:'person',label:p.name.split(' ')[0],color:avatarColor(rid),r:12});
      links.push({source:'ep-'+ep.id,target:'p-'+rid,type:'person'});
    });
  });
  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.type==='theme'?120:80).strength(.4))
    .force('charge',d3.forceManyBody().strength(-250))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>d.r+12));
  const g=d3svg.append('g');
  d3svg.call(d3.zoom().scaleExtent([.3,3]).on('zoom',e=>g.attr('transform',e.transform)));
  const link=g.append('g').selectAll('line').data(links).join('line').attr('stroke','#ddd').attr('stroke-width',d=>d.type==='theme'?1.5:.8).attr('stroke-dasharray',d=>d.type==='person'?'4,4':null);
  const node=g.append('g').selectAll('g').data(nodes).join('g').attr('cursor','pointer')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  node.append('circle').attr('r',d=>d.r).attr('fill',d=>d.color).attr('fill-opacity',.85).attr('stroke','#fff').attr('stroke-width',2);
  node.append('text').attr('text-anchor','middle').attr('dominant-baseline','central').attr('fill','#fff').attr('font-size',d=>d.type==='ep'?11:9).attr('font-weight','600').text(d=>d.label.substring(0,8));
  node.append('title').text(d=>d.title||d.label);
  sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);});
}

// ══════════════════════════════════════════════════════════════════
// BLOG / TEXT EDITOR
// ══════════════════════════════════════════════════════════════════
function renderBlogList(){
  const q=norm(document.getElementById('blog-search')?.value||'');
  const list=DATA.episodes.filter(ep=>norm(ep.title+(ep.published?.body||'')+ep.researchers.map(rid=>DATA.people.find(x=>x.id===rid)?.name||'').join(' ')).includes(q));
  document.getElementById('blog-list').innerHTML=list.map(ep=>{
    const pub=ep.published||{};
    const c=epColor(ep);
    const hasDraft=pub.body?.trim().length>0;
    return `<div class="s-item${selBlog===ep.id?' active':''}" onclick="openBlogEp(${ep.id})">
      <div class="ep-n-badge" style="background:${c}22;color:${c}">${ep.id}</div>
      <div style="flex:1"><div class="s-name">${ep.title}</div><div class="s-sub">${ep.month} ${ep.year} · ${hasDraft?'rascunho pronto':'sem rascunho'}</div></div>
      ${hasDraft?'<span style="font-size:9px;background:var(--teal-light);color:var(--teal);padding:2px 5px;border-radius:3px;font-weight:700">OK</span>':''}
    </div>`;
  }).join('')||'<div class="empty">Nenhum resultado</div>';
}
function openBlogEp(id){
  selBlog=id;renderBlogList();
  const ep=DATA.episodes.find(e=>e.id===id);if(!ep)return;
  if(!ep.published)ep.published={title:'',subtitle:'',intro:'',body:'',keywords:''};
  const pub=ep.published;
  const res=ep.researchers.map(rid=>DATA.people.find(x=>x.id===rid)).filter(Boolean);
  document.getElementById('blog-content').innerHTML=`
    <div class="blog-inner">
      <div style="margin-bottom:20px">
        <div style="font-size:11px;color:var(--ink3);margin-bottom:4px">Episódio ${ep.id} · ${ep.month} ${ep.year}</div>
        <div style="font-family:var(--font-display);font-size:22px;font-weight:700">${ep.title}</div>
        <div style="font-size:13px;color:var(--ink3);margin-top:4px">${res.map(r=>r.name).join(' & ')}</div>
      </div>
      <div class="meta-card">
        <div class="dos-card-h">Metadados para publicação</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><div class="field-label">Título do post</div><input class="field-input" value="${pub.title||''}" placeholder="Título editado para o blog" onchange="updPub(${ep.id},'title',this.value)"></div>
          <div><div class="field-label">Palavras-chave</div><input class="field-input" value="${pub.keywords||''}" placeholder="moderação, plataformas..." onchange="updPub(${ep.id},'keywords',this.value)"></div>
        </div>
        <div style="margin-top:10px"><div class="field-label">Subtítulo / linha fina</div><input class="field-input" value="${pub.subtitle||''}" onchange="updPub(${ep.id},'subtitle',this.value)"></div>
      </div>
      <div class="meta-card">
        <div class="dos-card-h">Introdução editorial (texto do DigiLabour antes da entrevista)</div>
        <textarea class="field-ta" rows="5" placeholder="Contextualize o entrevistado e a relevância da conversa..." onchange="updPub(${ep.id},'intro',this.value)">${pub.intro||''}</textarea>
      </div>
      <div class="blog-editor-wrap">
        <div class="blog-toolbar">
          <span style="font-size:11px;font-weight:700;color:var(--ink3);margin-right:6px;text-transform:uppercase;letter-spacing:.4px">Formatar:</span>
          ${[['P:','**P:** ',''],['R:','**R:** ',''],['Negrito','**','**'],['Itálico','_','_'],['Citação','> ',''],['Subtítulo','## ','']].map(([l,pre,pos])=>`<button class="tool-btn" onclick="insertFormat(${ep.id},'${pre}','${pos}')">${l}</button>`).join('')}
          <button class="tool-btn" onclick="autoFill(${ep.id})" style="margin-left:auto;background:var(--vinho-pale);color:var(--vinho)">Gerar estrutura</button>
        </div>
        <textarea class="blog-editor" id="blog-body-${ep.id}" placeholder="P: Primeira pergunta...\nR: Resposta..." onchange="updPub(${ep.id},'body',this.value)">${pub.body||''}</textarea>
      </div>
      <div class="btn-row" style="padding-bottom:32px">
        <button class="btn btn-vinho" onclick="save()">Salvar rascunho</button>
        <button class="btn" onclick="copyBlog(${ep.id})">Copiar texto</button>
      </div>
    </div>`;
}
function updPub(epId,f,v){const ep=DATA.episodes.find(e=>e.id===epId);if(ep){if(!ep.published)ep.published={};ep.published[f]=v;}}
function insertFormat(epId,pre,pos){const ta=document.getElementById('blog-body-'+epId);if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.substring(s,e);ta.value=ta.value.substring(0,s)+pre+sel+pos+ta.value.substring(e);ta.focus();ta.selectionStart=s+pre.length;ta.selectionEnd=s+pre.length+sel.length;updPub(epId,'body',ta.value);}
function autoFill(epId){const ep=DATA.episodes.find(e=>e.id===epId);if(!ep)return;const qs=ep.questions.map((q,i)=>`P: ${q}\n\nR: `).join('\n\n---\n\n');if(!ep.published)ep.published={};ep.published.body=qs||`P: [Primeira pergunta]\n\nR: `;const ta=document.getElementById('blog-body-'+epId);if(ta)ta.value=ep.published.body;save();}
function copyBlog(epId){const ep=DATA.episodes.find(e=>e.id===epId);if(!ep)return;const pub=ep.published||{};const text=`${pub.title||ep.title}\n${pub.subtitle||''}\n\n${pub.intro||''}\n\n${pub.body||''}`.trim();navigator.clipboard.writeText(text).then(()=>alert('Texto copiado!'));}

// ══════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════
function init(){
  DATA=loadData();
  initMap();
  renderDash();
  renderDosList();
  renderIntList();
  renderAnalysis();
  renderBlogList();
}
init();
</script>
