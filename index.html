<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Moderation Lab · luquizis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#fdfdfd;--surface:#fff;--border:#e0e0e0;--text:#1a1a1a;--muted:#666;--accent:#000;
  --t-w:#854f0b;--t-g:#1a3a5c;--t-a:#0a6b50;--t-s:#8c2e10;--t-j:#534ab7;
  --panel:500px;--nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
.serif{font-family:Georgia,serif;line-height:1.7}

/* ── TOP NAV ── */
#topnav{height:var(--nav);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:24px;background:#fff;z-index:1000;position:relative}
.brand{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.nav-tabs{display:flex;gap:25px;margin-left:20px}
.nav-tab{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-transform:uppercase;border-bottom:2px solid transparent;padding:22px 0}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── CONSTELAÇÃO / COMPARADOR ── */
#comparison-panel{
    position:fixed;bottom:20px;left:20px;z-index:1500;background:#fff;border:2px solid #000;
    width:600px;max-height:80vh;display:none;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,0.2);
}
.comp-header{padding:15px;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center}
.comp-body{padding:20px;overflow-y:auto;font-size:13px}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ── MAP & LIST ── */
.page{display:none;height:calc(100vh - var(--nav))}
.page.active{display:flex}
#map{flex:1;filter:grayscale(1) contrast(1.1)}
.sidebar-list{width:320px;border-right:1px solid var(--border);overflow-y:auto}
.list-item{padding:15px 20px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.list-item:hover{background:#f9f9f9}
.list-item.active{background:#f0f0f0;border-right:4px solid #000}

/* ── EDITORIAL SIDE PANEL ── */
#side-panel{
    width:var(--panel);height:100%;background:#fff;border-left:1px solid var(--border);
    position:absolute;right:0;top:0;z-index:800;transform:translateX(100%);transition:0.4s;
    display:flex;flex-direction:column;
}
#side-panel.open{transform:translateX(0)}

/* ── FORMS (ORCID METADATA) ── */
.edit-area{flex:1;padding:40px;overflow-y:auto;background:#f9f9f9}
.orcid-section{background:#fff;padding:20px;border:1px solid var(--border);margin-bottom:20px}
.section-title{font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:15px;color:#aaa;border-bottom:1px solid #eee;padding-bottom:5px}
.field-group{margin-bottom:15px}
label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:5px;color:#888}
input, textarea, select{width:100%;padding:10px;border:1px solid #ddd;font-size:13px}

.btn{padding:10px 18px;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;border:1px solid #000}
.btn-black{background:#000;color:#fff}
.btn-red{border-color:#c00;color:#c00}

.marker-cluster{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.2);overflow:hidden}
</style>
</head>
<body>

<div id="topnav">
  <div class="brand">Content Moderation <span>CMS</span></div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchPage('map',this)">Mapa & Constelação</div>
    <div class="nav-tab" onclick="switchPage('list',this)">Gestão de Pesquisadores</div>
  </div>
  <div style="margin-left:auto; display:flex; gap:10px">
      <button class="btn" onclick="addNewResearcher()">+ Novo Pesquisador</button>
      <button class="btn btn-black" onclick="saveAll()">Salvar Global</button>
  </div>
</div>

<div class="page active" id="page-map">
  <div id="map"></div>
  <div id="comparison-panel">
      <div class="comp-header">
          <span>Constelação: Comparativo de Abordagens</span>
          <span style="cursor:pointer" onclick="closeComparison()">×</span>
      </div>
      <div class="comp-body" id="comp-body"></div>
  </div>
  <div id="side-panel">
      <div style="padding:40px" id="panel-content"></div>
  </div>
</div>

<div class="page" id="page-list">
  <div class="sidebar-list" id="res-list"></div>
  <div class="edit-area" id="res-editor">
      <div class="serif" style="text-align:center; padding-top:100px; color:#ccc">Selecione para editar metadados ORCID</div>
  </div>
</div>

<script>
// --- DATA E CONFIG ---
const TAG_LABELS={w:'Trabalho',g:'Governança',a:'Algoritmos',s:'Sul Global',j:'Jornalismo'};
let DATA = { researchers: [] };
let selectedForComparison = new Set();
let map, markers = {};

// --- LOAD DATA ---
function loadData(){
    const s = localStorage.getItem('digilabour_orcid_db');
    if(s) DATA = JSON.parse(s);
    else DATA.researchers = [
        {id:'1', name:'Sarah T. Roberts', orcid:'0000-0003-2415-397X', org:'UCLA', lat:34.05, lng:-118.24, bio:'Digital labor specialist.', employment:'Associate Professor at UCLA', education:'PhD at University of Illinois', tags:['w','s']},
        {id:'2', name:'Rafael Zanatta', orcid:'0000-0002-3682-1549', org:'Data Privacy Brasil', lat:-23.56, lng:-46.64, bio:'Law and technology specialist.', employment:'Director at Data Privacy Brasil', education:'PhD at USP', tags:['g','s']}
    ];
}

function saveAll(){
    localStorage.setItem('digilabour_orcid_db', JSON.stringify(DATA));
    alert("Dados salvos!");
    renderMapMarkers();
}

// --- ORCID CRUD ---
function addNewResearcher(){
    const id = Date.now().toString();
    const newRes = {
        id, name: 'Novo Pesquisador', orcid:'', org:'', lat:0, lng:0,
        bio:'', employment:'', education:'', tags:[]
    };
    DATA.researchers.push(newRes);
    switchPage('list', document.querySelectorAll('.nav-tab')[1]);
    renderResearcherList();
    editResearcher(id);
}

function deleteResearcher(id){
    if(confirm("Deseja remover este pesquisador?")){
        DATA.researchers = DATA.researchers.filter(r => r.id !== id);
        saveAll();
        renderResearcherList();
        document.getElementById('res-editor').innerHTML = '';
    }
}

// --- MAP & CONSTELLATION ---
function initMap(){
    map = L.map('map', {center:[10,0], zoom:2, zoomControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    renderMapMarkers();
}

function renderMapMarkers(){
    Object.values(markers).forEach(m => map.removeLayer(m));
    DATA.researchers.forEach(r => {
        const icon = L.divIcon({
            className: 'marker-cluster',
            html: `<div style="background:#000; width:100%; height:100%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold">${r.name[0]}</div>`
        });
        const m = L.marker([r.lat, r.lng], {icon}).addTo(map)
            .on('click', (e) => {
                if(e.originalEvent.shiftKey) {
                    toggleComparison(r.id);
                } else {
                    openProfile(r.id);
                }
            });
        markers[r.id] = m;
    });
}

function toggleComparison(id){
    if(selectedForComparison.has(id)) selectedForComparison.delete(id);
    else selectedForComparison.add(id);
    
    if(selectedForComparison.size >= 2) renderConstellation();
    else document.getElementById('comparison-panel').style.display = 'none';
}

function renderConstellation(){
    const panel = document.getElementById('comparison-panel');
    const body = document.getElementById('comp-body');
    panel.style.display = 'flex';
    
    const items = Array.from(selectedForComparison).map(id => DATA.researchers.find(r => r.id === id));
    
    // Lógica de Constelação: Encontrar Interseções
    const commonTags = items[0].tags.filter(t => items.every(it => it.tags.includes(t)));
    
    let html = `<div style="margin-bottom:20px"><strong>Temas Convergentes:</strong> ${commonTags.map(t => TAG_LABELS[t]).join(', ') || 'Sem interseção direta'}</div>`;
    html += `<div class="comp-grid">`;
    
    items.forEach(it => {
        html += `
            <div style="border-left:2px solid #000; padding-left:15px">
                <div class="uppercase" style="font-size:10px; color:#999">${it.org}</div>
                <div style="font-weight:800; margin-bottom:10px">${it.name}</div>
                <div class="serif" style="font-size:12px"><strong>Abordagem:</strong> ${it.bio.substring(0,100)}...</div>
            </div>
        `;
    });
    
    html += `</div>`;
    body.innerHTML = html;
}

function closeComparison(){
    selectedForComparison.clear();
    document.getElementById('comparison-panel').style.display = 'none';
}

// --- EDITORIAL UI ---
function renderResearcherList(){
    const list = document.getElementById('res-list');
    list.innerHTML = DATA.researchers.map(r => `
        <div class="list-item" onclick="editResearcher('${r.id}')">
            <div style="font-weight:700">${r.name}</div>
        </div>
    `).join('');
}

function editResearcher(id){
    const r = DATA.researchers.find(x => x.id === id);
    const editor = document.getElementById('res-editor');
    editor.innerHTML = `
        <div class="orcid-section">
            <div class="section-title">ORCID iD & Identificação</div>
            <div class="field-group"><label>Nome Completo</label><input type="text" value="${r.name}" onchange="updateVal('${id}','name',this.value)"></div>
            <div class="field-group"><label>ORCID iD</label><input type="text" value="${r.orcid}" placeholder="0000-0000-0000-0000" onchange="updateVal('${id}','orcid',this.value)"></div>
            <div class="field-group"><label>Organização Atual</label><input type="text" value="${r.org}" onchange="updateVal('${id}','org',this.value)"></div>
        </div>
        
        <div class="orcid-section">
            <div class="section-title">Biography (Moderação de Conteúdo)</div>
            <div class="field-group"><label>Resumo da Abordagem</label><textarea rows="4" onchange="updateVal('${id}','bio',this.value)">${r.bio}</textarea></div>
            <div class="field-group"><label>Temas (Eixos)</label>
                <div style="display:flex; gap:10px; flex-wrap:wrap">
                    ${Object.entries(TAG_LABELS).map(([k,v]) => `
                        <label style="font-size:9px"><input type="checkbox" ${r.tags.includes(k)?'checked':''} onchange="toggleTag('${id}','${k}')"> ${v}</label>
                    `).join('')}
                </div>
            </div>
        </div>

        <div class="orcid-section">
            <div class="section-title">Employment & Education (ORCID Standard)</div>
            <div class="field-group"><label>Employment History</label><textarea onchange="updateVal('${id}','employment',this.value)">${r.employment}</textarea></div>
            <div class="field-group"><label>Education</label><textarea onchange="updateVal('${id}','education',this.value)">${r.education}</textarea></div>
        </div>

        <div class="orcid-section" style="border-color:#ffcccc">
            <div class="section-title" style="color:#c00">Coordenadas Geográficas</div>
            <div style="display:flex; gap:10px">
                <input type="number" step="any" value="${r.lat}" placeholder="Lat" onchange="updateVal('${id}','lat',parseFloat(this.value))">
                <input type="number" step="any" value="${r.lng}" placeholder="Lng" onchange="updateVal('${id}','lng',parseFloat(this.value))">
            </div>
        </div>
        
        <button class="btn btn-red" onclick="deleteResearcher('${id}')">Excluir Pesquisador</button>
    `;
}

function updateVal(id, field, val){
    const r = DATA.researchers.find(x => x.id === id);
    if(r) r[field] = val;
    saveAll();
}

function toggleTag(id, tag){
    const r = DATA.researchers.find(x => x.id === id);
    if(r.tags.includes(tag)) r.tags = r.tags.filter(t => t !== tag);
    else r.tags.push(tag);
    saveAll();
}

function switchPage(id, el){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`page-${id}`).classList.add('active');
    el.classList.add('active');
    if(id === 'map') map.invalidateSize();
}

window.onload = () => { loadData(); initMap(); renderResearcherList(); };
</script>
</body>
</html>
